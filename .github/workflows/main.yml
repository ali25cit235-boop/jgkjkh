name: RdpByNTechDz-Admin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Maximize CPU, RAM & Free Storage Space
        run: |
          # 1. High Performance Power Plan
          powercfg /setactive SCHEME_MIN

          # 2. Virtual RAM Expand (32 GB Pagefile Boost via Registry)
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' -Name "PagingFiles" -Value "C:\pagefile.sys 32768 32768"

          # 3. Clean Junk Folders to Maximize Storage (~35 GB Extra Space)
          Remove-Item -Path "C:\hostedtoolcache" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Android" -Recurse -Force -ErrorAction SilentlyContinue

          # 4. Disable Visual Effects
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

      - name: Configure RDP and Create Admin User
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          New-LocalUser "NTechDz" -Password (ConvertTo-SecureString -AsPlainText "W1nd0ws-P4ssw0rd-2025!" -Force) -FullName "NTechDz User"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "NTechDz"
          Add-LocalGroupMember -Group "Administrators" -Member "NTechDz"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

      - name: Start TCP RDP Tunnel via Serveo
        run: |
          Write-Host "======================================================================"
          Write-Host "            RDP Connection Details - NTechDz Channel"
          Write-Host "======================================================================"
          Write-Host "Username:    NTechDz (Administrator)"
          Write-Host "Password:    W1nd0ws-P4ssw0rd-2025!"
          Write-Host "======================================================================"
          ssh -T -o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net
