name: Rdp1-ByNTechDz

on:
  schedule:
    - cron: '0 */6 * * *'  # Har 6 ghante baad auto-restart hoga
  workflow_dispatch:        # Manual start karne ke liye

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Configure RDP & Create Admin
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

          New-LocalUser "NTechDz" -Password (ConvertTo-SecureString -AsPlainText "W1nd0ws-P4ssw0rd-2025!" -Force) -FullName "NTechDz User"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "NTechDz"
          Add-LocalGroupMember -Group "Administrators" -Member "NTechDz"

      - name: Connect Oracle SSH Tunnel & Send Info to Discord
        run: |
          # SSH client / PuTTY install karo
          choco install putty -y

          # APNI ORACLE VPS KI DETAILS YAHAN DARJ KARO
          $oracleIP = "129.213.164.255"        # e.g. "129.150.x.x"
          $oracleUser = "ubuntu"              # Oracle VPS user
          $oraclePass = "ali"# Jo password set kiya tha
          $rdpPort = "33891"                  # Target Port (RDP 1 ke liye)

          # Background me Oracle VPS ke sath tunnel start karo
          Start-Process -FilePath "plink.exe" -ArgumentList "-ssh -pw $oraclePass -N -R 0.0.0.0:${rdpPort}:localhost:3389 ${oracleUser}@${oracleIP} -batch"
          Start-Sleep -Seconds 12

          # Final Connection IP Address
          $cleanIP = "${oracleIP}:${rdpPort}"

          # DISCORD WEBHOOK URL YAHAN PASTE KARO
          $webhookUrl = "https://discordapp.com/api/webhooks/1552646110085128192/VeYatEQXEi2XQSOKyRU1qcvKeaCvR2jalJwZ12V5lA_ybI3ZRJz88mmneuQ2pBaNp7px"

          $cb = '```'
          $ipFormatted = "$cb$cleanIP$cb"

          $payload = @{
              username = "RDP Manager Bot"
              embeds = @(
                  @{
                      title = "🚀 New RDP Ready (Ticket 001)"
                      color = 3066993
                      fields = @(
                          @{ name = "IP"; value = $ipFormatted; inline = $false },
                          @{ name = "Username"; value = "NTechDz"; inline = $true },
                          @{ name = "Password"; value = "W1nd0ws-P4ssw0rd-2025!"; inline = $true }
                      )
                  }
              )
          } | ConvertTo-Json -Depth 5

          Invoke-RestMethod -Uri $webhookUrl -Method Post -Body $payload -ContentType "application/json"

      - name: Keep Alive Loop
        run: |
          # Runner ko active rakhne ke liye loop
          while ($true) {
              Start-Sleep -Seconds 60
          }
