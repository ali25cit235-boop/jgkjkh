name: RdpByNTechDz-Admin

on:
  schedule:
    - cron: '0 */6 * * *'  # Har 6 ghante baad auto-run hoga
  workflow_dispatch:        # Manual run karne ke liye

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Power & Pagefile Optimization
        run: |
          Write-Host "⏳ Setting High Performance Power Plan..."
          powercfg /setactive SCHEME_MIN

          Write-Host "⏳ Expanding Virtual RAM (Pagefile) to 32 GB..."
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' -Name "PagingFiles" -Value "C:\pagefile.sys 32768 32768"

          Write-Host "⏳ Disabling Visual Effects..."
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2

      - name: Freeing Up Storage Space
        run: |
          Remove-Item -Path "C:\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\hostedtoolcache" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Configure RDP & Create Admin
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

          New-LocalUser "NTechDz" -Password (ConvertTo-SecureString -AsPlainText "W1nd0ws-P4ssw0rd-2025!" -Force) -FullName "NTechDz User"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "NTechDz"
          Add-LocalGroupMember -Group "Administrators" -Member "NTechDz"

      - name: Start Pinggy Tunnel & Send Clean IP to Discord
        run: |
          # Pinggy SSH Tunnel Start
          Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R 0:localhost:3389 tcp@a.pinggy.io" -RedirectStandardOutput "pinggy.log" -RedirectStandardError "pinggy_err.log"
          Start-Sleep -Seconds 15

          # Logs read karo
          $logContent = ""
          if (Test-Path "pinggy.log") { $logContent += Get-Content "pinggy.log" -Raw }
          if (Test-Path "pinggy_err.log") { $logContent += Get-Content "pinggy_err.log" -Raw }

          # Clean ANSI color codes
          $cleanLog =$logContent -replace '\x1b\[[0-9;]*[a-zA-Z]', ''

          # Smart Regex: Pinggy ke sabhi domain extensions (.io, .link, .online) catch karega
          $cleanIP = "Not Found"
          if ($cleanLog -match "([\w\.-]+\.pinggy\.[a-zA-Z]+:\d+)") {
              $cleanIP =$matches[1] -replace 'tcp://', ''
          } elseif ($cleanLog -match "tcp://([^\s\x00-\x1f]+)") {
              $cleanIP =$matches[1]
          }

          # DISCORD WEBHOOK CONFIGURATION
          $webhookUrl = "https://discordapp.com/api/webhooks/1552564274096898068/9UaYtqXocUgkmVnuDMq2QVdZ5UMqRDjxVGTIUXO63lPEFgG3mpi9soL3IAQRshVa7O_K"

          $cb = '```'
          $ipFormatted = "$cb$cleanIP$cb"

          $payload = @{
              username = "RDP Manager Bot"
              embeds = @(
                  @{
                      title = "🚀 New RDP Ready (Ticket 001)"
                      color = 3066993
                      fields = @(
                          @{ name = "IP"; value = $ipFormatted; inline = $false },
                          @{ name = "Username"; value = "NTechDz"; inline = $true },
                          @{ name = "Password"; value = "W1nd0ws-P4ssw0rd-2025!"; inline = $true }
                      )
                  }
              )
          } | ConvertTo-Json -Depth 5

          Invoke-RestMethod -Uri $webhookUrl -Method Post -Body $payload -ContentType "application/json"

      - name: Keep Alive Loop
        run: |
          while ($true) {
              Start-Sleep -Seconds 60
          }
