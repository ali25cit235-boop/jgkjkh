name: Rdp1-ByNTechDz

on:
  workflow_dispatch:

jobs:
  request-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Send Waiting Alert to Discord
        run: |
          $webhookUrl = "https://discordapp.com/api/webhooks/1552646105735364708/aV6IoOuCKUqnVCHbfPPCN-dzFsRkri3Ufzh2ViFPM1UA-kPfmjg7p9sKuI9hZNb9XYOW"
          $payload = @{
              username = "RDP Manager Bot"
              embeds = @(
                  @{
                      title = "⏳ Wait for Admin Approval"
                      description = "New RDP request initiated. Please approve the workflow run in GitHub Actions to generate credentials."
                      color = 16776960 # Yellow warning color
                  }
              )
          } | ConvertTo-Json -Depth 5
          # Agar aap PowerShell ya curl use kar rahe hain (Linux runner par curl chalega)
          curl -H "Content-Type: application/json" -X POST -d '$payload' $webhookUrl
