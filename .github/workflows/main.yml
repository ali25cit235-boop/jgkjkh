name: Rdp1-ByNTechDz

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Configure RDP & Create Admin
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

          New-LocalUser "NTechDz" -Password (ConvertTo-SecureString -AsPlainText "W1nd0ws-P4ssw0rd-2025!" -Force) -FullName "NTechDz User"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "NTechDz"
          Add-LocalGroupMember -Group "Administrators" -Member "NTechDz"

      - name: Connect Oracle SSH Tunnel & Send Diagnostic Info to Discord
        run: |
          choco install putty -y

          $oracleIP = "129.213.164.255"
          $oracleUser = "ubuntu"
          $oraclePass = "ali"  # Oracle VPS ka password
          $rdpPort = "33891"
          $webhookUrl = "https://discordapp.com/api/webhooks/1552646105735364708/aV6IoOuCKUqnVCHbfPPCN-dzFsRkri3Ufzh2ViFPM1UA-kPfmjg7p9sKuI9hZNb9XYOW" # Discord Webhook URL

          # Correct non-blocking command using echo y to accept host key
          $plinkCmd = "echo y | plink.exe -ssh -pw `"$oraclePass`" -batch -N -R 0.0.0.0:${rdpPort}:127.0.0.1:3389 ${oracleUser}@${oracleIP}"
          Start-Process powershell -ArgumentList "-Command $plinkCmd" -RedirectStandardOutput "ssh_out.log" -RedirectStandardError "ssh_err.log"

          Start-Sleep -Seconds 15

          # Diagnostic Log Check
          $errLog = ""
          if (Test-Path "ssh_err.log") { $errLog = Get-Content "ssh_err.log" -Raw }
          
          $statusText = "Tunnel Active & Forwarded"
          if ($errLog -and $errLog.Trim().Length -gt 0 -and$errLog -notmatch "Store key in cache") {
              $statusText = "Tunnel Error: $errLog"
          }

          $cleanIP = "${oracleIP}:${rdpPort}"
          $cb = '```'
          $ipFormatted = "$cb$cleanIP$cb"

          $payload = @{
              username = "RDP Manager Bot"
              embeds = @(
                  @{
                      title = "🚀 New RDP Ready (Ticket 001)"
                      color = 3066993
                      fields = @(
                          @{ name = "IP"; value = $ipFormatted; inline = $false },
                          @{ name = "Status/Diagnostic"; value = "$cb$statusText$cb"; inline = $false },
                          @{ name = "Username"; value = "NTechDz"; inline = $true },
                          @{ name = "Password"; value = "W1nd0ws-P4ssw0rd-2025!"; inline = $true }
                      )
                  }
              )
          } | ConvertTo-Json -Depth 5

          Invoke-RestMethod -Uri $webhookUrl -Method Post -Body $payload -ContentType "application/json"

      - name: Keep Alive Loop
        run: |
          while ($true) {
              Start-Sleep -Seconds 60
          }
