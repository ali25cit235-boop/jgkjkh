name: Rdp1-ByNTechDz

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Configure RDP & Create Admin
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

          New-LocalUser "NTechDz" -Password (ConvertTo-SecureString -AsPlainText "W1nd0ws-P4ssw0rd-2025!" -Force) -FullName "NTechDz User"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "NTechDz"
          Add-LocalGroupMember -Group "Administrators" -Member "NTechDz"

      - name: Setup Secure SSH Known Hosts & Connect Tunnel
        run: |
          # Oracle VPS ki verified public key ko GitHub runner par securely save karna
          $sshDir = "$env:USERPROFILE\.ssh"
          if (!(Test-Path $sshDir)) { New-Item -ItemType Directory -Path$sshDir }
          
          # Aapki di gayi exact verified key ko known_hosts me likh rahe hain
          "129.213.164.255 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEsDzi4hhwVmbrhwypuXSa2whtCDeRzhpU+5IXTdTcZM" | Out-File -Encoding ascii "$sshDir\known_hosts"

          $oracleIP = "129.213.164.255"
          $oracleUser = "ubuntu"
          $oraclePass = "ali"  # Apna Oracle VPS ka password yahan likho
          $rdpPort = "33891"
          $webhookUrl = "https://discordapp.com/api/webhooks/1552653122311159839/k8LUVGUa5IawEggs_5I2r_oRDEatxXjwXeYSObx-nymSpC3ZJKGBvpBIAihClJr2gYVW" # Apna Discord Webhook URL yahan likho

          # Native SSH Tunnel in background with verified key check
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "ssh"
          $psi.Arguments = "-o ServerAliveInterval=30 -N -R 0.0.0.0:${rdpPort}:127.0.0.1:3389 ${oracleUser}@${oracleIP}"
          $psi.UseShellExecute = $false$psi.RedirectStandardInput = $true$psi.RedirectStandardError = "ssh_err.log"
          $psi.RedirectStandardOutput = "ssh_out.log"
          $p = [System.Diagnostics.Process]::Start($psi)
          
          # Send password non-interactively
          $p.StandardInput.WriteLine($oraclePass)

          Start-Sleep -Seconds 12

          $cleanIP = "${oracleIP}:${rdpPort}"
          $cb = '```'
          $ipFormatted = "$cb$cleanIP$cb"

          $payload = @{
              username = "RDP Manager Bot"
              embeds = @(
                  @{
                      title = "🚀 New RDP Ready (Securely Verified)"
                      color = 3066993
                      fields = @(
                          @{ name = "IP"; value = $ipFormatted; inline = $false },
                          @{ name = "Username"; value = "NTechDz"; inline = $true },
                          @{ name = "Password"; value = "W1nd0ws-P4ssw0rd-2025!"; inline = $true }
                      )
                  }
              )
          } | ConvertTo-Json -Depth 5

          Invoke-RestMethod -Uri $webhookUrl -Method Post -Body $payload -ContentType "application/json"

      - name: Keep Alive Loop
        run: |
          while ($true) {
              Start-Sleep -Seconds 60
          }
